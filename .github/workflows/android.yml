# Builds the Android APK on GitHub's servers and publishes it as a release you can download on the phone.
# Runs when a tag like apk-v1.0.0 is pushed, or from Actions → "Android APK" → Run workflow.
name: Android APK

on:
  push:
    tags: ['apk-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing passphrase is set
        env:
          PASS: ${{ secrets.ANDROID_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$PASS" ]; then
            echo "::error::Add the repository secret ANDROID_SIGNING_PASSPHRASE (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Sign with the study key
        env:
          PASS: ${{ secrets.ANDROID_SIGNING_PASSPHRASE }}
        run: |
          VER=$(node -p "require('./app.json').expo.version")
          echo "VER=$VER" >> "$GITHUB_ENV"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android-signing/enl-release.jks.enc -out "$RUNNER_TEMP/ks.jks" -pass env:PASS
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-pass env:PASS --ks-key-alias enl --key-pass env:PASS \
            --out "ENL-Thesis-Manager-$VER.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "ENL-Thesis-Manager-$VER.apk" | grep -i "SHA-256"
          rm -f "$RUNNER_TEMP/ks.jks"
          ls -lh "ENL-Thesis-Manager-$VER.apk"

      - name: Publish as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v$VER"
          NOTES="ENL Thesis Manager $VER for Android. On the phone: open this page, tap the .apk file, then open it to install (allow 'Install unknown apps' for your browser once)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "ENL-Thesis-Manager-$VER.apk" --clobber
          else
            gh release create "$TAG" "ENL-Thesis-Manager-$VER.apk" --title "ENL Thesis Manager $VER" --notes "$NOTES" --latest
          fi
